<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RIFE 播放列表</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="brand-row">
          <h1>RIFE</h1>
          <div class="status" id="streamStatus">待机</div>
        </div>
        <p class="now" id="nowPlaying">未选择媒体</p>
      </div>
      <button type="button" id="copyBtn" class="hls" title="复制 HLS 地址">
        <span class="hls-k" id="hlsHint">HLS</span>
        <span class="hls-url" id="hlsUrl"></span>
      </button>
    </div>
  </header>

  <main class="workspace">
    <section class="viewer card" aria-label="内置播放器">
      <video id="videoPlayer" controls playsinline preload="auto"></video>
      <p id="playerHint" class="hint" role="status">选择一集后点击播放</p>
      <div class="playback-controls" aria-label="播放控制与画面设置">
        <div class="transport">
          <button type="button" id="prevBtn">上一集</button>
          <button type="button" id="playBtn" class="primary">播放</button>
          <button type="button" id="nextBtn">下一集</button>
          <button type="button" id="stopBtn">停止转码</button>
        </div>
        <div class="playback-settings">
          <label class="field">
            <span>片头设置</span>
            <input type="text" id="introSeconds" value="0:00" placeholder="1:30" autocomplete="off">
          </label>
          <label class="switch">
            <input type="checkbox" id="skipIntro">
            <span>跳过片头</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="anime4k">
            <span>Anime4K</span>
          </label>
        </div>
      </div>
      <label for="timeline">整集进度 <span id="playbackTime">0:00 / --:--</span></label>
      <input id="timeline" type="range" min="0" max="0" step="0.25" value="0" disabled aria-label="整集播放进度">
      <p class="hint">拖动整集进度条可跳转；未转码的位置需等待缓冲。视频内的进度条仅对应已生成的片段。</p>
      <p class="error" id="errorBox" hidden></p>
    </section>
    <aside class="sidebar card" aria-label="播放列表侧栏">
      <div class="panel-head">
        <h2>播放列表</h2>
        <div class="playlist-actions">
          <button type="button" id="openAddBtn" class="primary" aria-haspopup="dialog" aria-controls="addDialog">添加</button>
          <button type="button" id="clearBtn" class="ghost">清空</button>
        </div>
      </div>
      <ol class="playlist" id="playlist"></ol>
    </aside>

  </main>
  <dialog id="addDialog" aria-labelledby="addDialogTitle">
    <form id="addForm">
      <h2 id="addDialogTitle">添加链接</h2>
      <label for="sourceInput" class="hint">每行一个 HTTP/HTTPS 链接，支持批量添加</label>
      <textarea id="sourceInput" rows="6" placeholder="https://example.com/video.m3u8" autofocus required></textarea>
      <p id="addError" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="cancelAddBtn">取消</button>
        <button type="submit" id="finishAddBtn" class="primary">完成</button>
      </div>
    </form>
  </dialog>
  <script src="/vendor/hls.min.js"></script>
  <script src="/player.js"></script>
  <script src="/app.js"></script>
</body>
</html>
