<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RIFE 播放列表</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="brand-row">
          <h1>RIFE</h1>
          <div class="status" id="streamStatus">待机</div>
        </div>
        <p class="now" id="nowPlaying">未选择媒体</p>
      </div>
      <button type="button" id="copyBtn" class="hls" title="复制 HLS 地址">
        <span class="hls-k" id="hlsHint">HLS</span>
        <span class="hls-url" id="hlsUrl"></span>
      </button>
    </div>
  </header>

  <main class="workspace">
    <section class="player card">
      <div class="panel-head">
        <h2>播放列表</h2>
        <button type="button" id="clearBtn" class="ghost">清空</button>
      </div>
      <ol class="playlist" id="playlist"></ol>
      <div class="progress">
        <span id="timeNow">0:00</span>
        <input type="range" id="seekBar" min="0" max="0" step="0.1" value="0" disabled>
        <span id="timeTotal">0:00</span>
      </div>
      <div class="transport">
        <button type="button" id="prevBtn">上一集</button>
        <button type="button" id="playBtn" class="primary">播放</button>
        <button type="button" id="nextBtn">下一集</button>
        <button type="button" id="stopBtn">停止转码</button>
      </div>
      <div class="skip-settings">
        <label class="field">
          <span>片头设置</span>
          <input type="number" id="introSeconds" min="0" step="1" value="0" placeholder="秒">
        </label>
        <label class="switch">
          <input type="checkbox" id="skipIntro">
          <span>跳过片头</span>
        </label>
        <label class="field">
          <span>片尾设置</span>
          <input type="number" id="outroSeconds" min="0" step="1" value="0" placeholder="秒">
        </label>
        <label class="switch">
          <input type="checkbox" id="skipOutro">
          <span>跳过片尾</span>
        </label>
      </div>
      <p class="error" id="errorBox" hidden></p>
    </section>

    <section class="sources card">
      <div class="panel-head">
        <h2>添加链接</h2>
      </div>
      <textarea id="sourceInput" rows="6" placeholder="每行一个 HTTP/HTTPS 链接"></textarea>
      <p class="hint">支持直链与本地路径，粘贴后可先加入列表或立刻开播。</p>
      <div class="row">
        <button type="button" id="addBtn">添加到列表</button>
        <button type="button" id="addPlayBtn" class="primary">添加并播放</button>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
