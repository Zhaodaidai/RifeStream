# MediaMTX 用本机 RTSP 接收 FFmpeg 发布，不对局域网提供 RTSP 播放。
rtspAddress: 127.0.0.1:8554
moq: false
rtmp: false
webrtc: false
srt: false

api: true
apiAddress: 127.0.0.1:9997

# RIFE 偶发卡住时不要把 RTSP 推流掐掉，否则 HLS muxer 会重建，
# 播放器重新打开清单就会从窗口第一片再播。
readTimeout: 30s
writeTimeout: 30s
writeQueueSize: 2048

# HLS muxer 只给本机代理用；局域网走 8888 上改写成 EVENT 的清单，
# 播放器按顺序播，卡顿时等缓冲，不追服务端实时沿。
hlsAddress: 127.0.0.1:8889
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: true
hlsVariant: fmp4
# 这是最短等待，不是目标片长。切片在「超过该时长后的下一枚 IDR」关闭。
# 编码器 GOP 为 floor(output_fps * 2s)，片长 ≤ 2.000s，TARGETDURATION 保持 2。
# 若这里写成 2s，略大于 2s 的 IDR 会把片长抬到 3s，客户端就会重拉清单乱跳。
hlsSegmentDuration: 1s
# ~4 小时（2s GOP）。必须够长，EVENT 清单才能一直从片头追加、不删旧片。
hlsSegmentCount: 7200
hlsDirectory: .hls
hlsMuxerCloseAfter: 60s

paths:
  all_others:
